name: Auto Run Key Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: pip install requests

      - name: Запуск скрипта бота
        run: python bot.py

      - name: Сохранение обновленных ключей в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted_keys.txt
          git diff-index --quiet HEAD || git commit -m "Авто-обновление конфигураций [GitHub Action]"
          git push
