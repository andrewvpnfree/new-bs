name: Hourly Config Updater

on:
  schedule:
    # Запуск каждые 5 часов (минута 0, каждый 5-й час)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой на GitHub

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает право экшену делать push обратно в репозиторий

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run updater script
      run: python update_keys.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Проверяем, изменился ли файл с конфигурациями
        if git status --porcelain | grep -q "cleaned_configs.txt"; then
          git add cleaned_configs.txt
          git commit -m "Автоматическое обновление ключей (каждые 5 часов)"
          git push
        else
          echo "Изменений в ключах не обнаружено."
        fi
